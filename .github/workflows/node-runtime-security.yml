name: Node runtime security

on:
  pull_request:
    paths:
      - 'examples/voice_solutions/realtime_translation_guide/browser-translation-demo/**'
      - 'examples/voice_solutions/realtime_translation_guide/twilio-translation-demo/**'
      - '.github/workflows/node-runtime-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm test
        working-directory: examples/voice_solutions/realtime_translation_guide/browser-translation-demo
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/voice_solutions/realtime_translation_guide/twilio-translation-demo
      - run: npm test
        working-directory: examples/voice_solutions/realtime_translation_guide/twilio-translation-demo
      - name: Build and verify the browser translation image
        run: |
          docker build --pull -t node-security-test examples/voice_solutions/realtime_translation_guide/browser-translation-demo
          docker run --rm --entrypoint node node-security-test -e 'if (process.versions.node !== "22.23.4") process.exit(1); console.log(process.version)'
